<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyphsmith – Pembuat Font Tulisan Tangan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
<div class="blobs"><i></i><i></i><i></i></div>

<header class="glass top">
  <div class="brand"><b>Glyphsmith</b><span>Gambar hurufmu, jadikan font</span></div>
  <div class="seg" data-seg="fmt"><button data-v="ttf">TTF</button><button data-v="otf">OTF</button></div>
  <button class="btn pri" data-act="export">Ekspor font</button>
  <button class="btn icon" data-act="theme" title="Ganti tema">◐</button>
</header>

<main>
  <!-- DAFTAR KARAKTER -->
  <aside class="glass panel">
    <input id="search" class="field" placeholder="Cari karakter, mis. aA1@">
    <div id="tabs" class="seg scroll"></div>
    <div id="grid"></div>
    <div class="prog"><div id="bar"></div></div>
    <small id="ptext"></small>
  </aside>

  <!-- EDITOR + PREVIEW -->
  <section class="center">
    <div class="glass stage">
      <div class="row">
        <div class="seg" data-seg="tool"><button data-v="pen">Pena</button><button data-v="eraser">Penghapus</button></div>
        <div class="seg" data-seg="shape"><button data-v="round">Bulat</button><button data-v="square">Kotak</button></div>
        <label class="rng">Ukuran <input type="range" min="2" max="80" data-ui="size"><output></output></label>
      </div>
      <div class="canvasWrap"><canvas id="view" width="500" height="500"></canvas><div id="curCh">A</div></div>
      <div class="row wrap">
        <button class="btn" data-act="undo">Urungkan</button>
        <button class="btn" data-act="redo">Ulangi</button>
        <button class="btn" data-act="clear">Bersihkan</button>
        <button class="btn" data-act="flipH">Balik ↔</button>
        <button class="btn" data-act="flipV">Balik ↕</button>
        <button class="btn" data-act="copy">Salin dari…</button>
        <button class="btn" data-act="img">Impor gambar</button>
        <span class="pad">
          <button class="btn sm" data-nudge="-1,0">←</button><button class="btn sm" data-nudge="0,-1">↑</button><button class="btn sm" data-nudge="0,1">↓</button><button class="btn sm" data-nudge="1,0">→</button>
        </span>
      </div>
      <div class="row">
        <label class="rng grow">Lebar karakter (advance) <input type="range" id="adv" min="100" max="1000" step="10"><output></output></label>
        <button class="btn" data-act="auto">Atur lebar otomatis</button>
      </div>
      <input type="file" id="imgFile" accept="image/*" hidden>
    </div>

    <div class="glass prev">
      <div class="row">
        <label class="rng grow">Ukuran <input type="range" min="24" max="140" data-ui="pvSize"><output></output></label>
        <label class="rng grow">Jarak huruf <input type="range" min="-60" max="200" data-ui="pvSp"><output></output></label>
      </div>
      <textarea id="pvText" class="field" rows="2">Halo Dunia! Quick brown fox 0123456789</textarea>
      <canvas id="pv"></canvas>
    </div>
  </section>

  <!-- PENGATURAN -->
  <aside class="glass panel">
    <h3>Tampilan editor</h3>
    <label class="sw"><span>Garis panduan</span><input type="checkbox" data-ui="guides"><i></i></label>
    <label class="sw"><span>Kisi (grid)</span><input type="checkbox" data-ui="grid"><i></i></label>
    <label class="sw"><span>Template bayangan</span><input type="checkbox" data-ui="ghost"><i></i></label>
    <select class="field" data-ui="ghostFont">
      <option value="sans-serif">Sans-serif</option><option value="serif">Serif</option><option value="cursive">Cursive</option>
      <option value="monospace">Monospace</option><option value="Georgia">Georgia</option><option value="Arial Black">Arial Black</option>
    </select>
    <label class="sw"><span>Tampilkan hasil vektor</span><input type="checkbox" data-ui="outline"><i></i></label>
    <label class="sw"><span>Mode simetri</span><input type="checkbox" data-ui="sym"><i></i></label>
    <label class="sw"><span>Tekanan pena stylus</span><input type="checkbox" data-ui="pressure"><i></i></label>

    <h3>Kualitas kontur</h3>
    <label class="rng">Kehalusan <input type="range" min="0" max="10" step="1" data-opt="smooth"><output></output></label>
    <label class="rng">Detail (toleransi) <input type="range" min="0.4" max="4" step="0.1" data-opt="detail"><output></output></label>
    <label class="rng">Ketajaman sudut <input type="range" min="0" max="180" step="5" data-opt="corner"><output></output></label>
    <label class="rng">Kemiringan (italic) <input type="range" min="0" max="25" step="1" data-opt="slant"><output></output></label>
    <label class="rng">Sidebearing otomatis <input type="range" min="0" max="150" step="5" data-opt="sb"><output></output></label>

    <h3>Info font</h3>
    <input class="field" data-meta="family" placeholder="Nama font">
    <input class="field" data-meta="style" placeholder="Style (Regular, Italic…)">
    <select class="field" data-meta="weight" data-num>
      <option value="300">Light 300</option><option value="400">Regular 400</option><option value="500">Medium 500</option>
      <option value="700">Bold 700</option><option value="900">Black 900</option>
    </select>
    <input class="field" data-meta="copyright" placeholder="Hak cipta (opsional)">
    <input class="field" data-meta="version" placeholder="Versi">

    <h3>Proyek</h3>
    <div class="row wrap">
      <button class="btn" data-act="saveP">Simpan proyek</button>
      <button class="btn" data-act="loadP">Buka proyek</button>
      <button class="btn" data-act="spec">Spesimen PNG</button>
      <button class="btn danger" data-act="reset">Reset semua</button>
    </div>
    <input type="file" id="projFile" accept=".json" hidden>
    <small class="hint">Tersimpan otomatis di browser. Pintasan: P pena, E penghapus, [ ] ukuran, panah geser (Shift = halus), PgUp/PgDn ganti karakter, Ctrl+Z urungkan, Ctrl+S simpan.</small>
  </aside>
</main>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="js/logic/core.js"></script>
<script src="js/logic/builder.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
